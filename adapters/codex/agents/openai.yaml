version: 1
metadata:
  display_name: "Generate Markdown"
  short_description: "Generate transcript Markdown and same-stem JSON from a URL or local audio/video file."
  default_prompt: "Use $generate-markdown to generate ListenKit transcript artifacts through python -m listenkit_cli generate-markdown from the repository root. If the host Python environment is uncertain, use cli/listenkit.sh generate-markdown on macOS/Linux/WSL or .\\cli\\listenkit.ps1 generate-markdown on native Windows. Add --report-json for file-based execution status. Accept exactly one input source: URL or local audio/video file. Require only --language and --output in addition to the input; let the wrapper derive ASR locale and the Markdown title unless the user requests an override. Leave ASR engine and device selection on automatic defaults. For --output path/name.md, consume path/name.md and path/name.json. Do not modify ListenKit to work around host PATH, shell, or stdout limitations, and do not expose lower-level pipeline commands."
